<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Banetto</title>
<style>
  :root{
    --bg:#121212; --head:#121212; --in:#262628; --out:#0b3c8f; --out-quote:#0f4aa8;
    --txt:#f2f2f2; --muted:#9a9aa0; --blue:#4c9bff; --green:#6ccf72; --sep:#3a3a3d;
    --kb:#2a2a2c; --key:#5c5c60; --key2:#3d3d40;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:Inter,"Noto Color Emoji",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .emoji{font-family:"Noto Color Emoji"}
  #app{position:relative;width:390px;height:844px;display:flex;flex-direction:column}
  /* status bar */
  .sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 44px;font-weight:600;font-size:16.5px}
  .sb .icons{display:flex;gap:6px;align-items:center}
  /* header */
  .hd{height:58px;flex:none;display:flex;align-items:center;padding:0 12px;gap:10px;border-bottom:.5px solid #1f1f21}
  .pill{height:40px;min-width:40px;border-radius:20px;background:#262628;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;gap:3px;padding:0 10px}
  .av{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    font-family:"Inter Display",Inter;font-weight:300;font-size:26px;color:#000;letter-spacing:-1px;transform:scaleX(.8)}
  .name{flex:1;font-weight:600;font-size:17px}
  /* chat */
  #chat{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:0 10px 8px}
  #chat>.day{margin-top:auto}
  #chat>*{flex-shrink:0}
  .day{align-self:center;background:#1f1f21;color:#d0d0d4;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:8px;margin:10px 0 8px}
  .note{align-self:center;text-align:center;color:var(--green);font-size:12.5px;line-height:1.45;max-width:300px;margin-bottom:12px}
  .msg{max-width:78%;border-radius:17px;padding:7px 11px 6px;font-size:16px;line-height:1.38;margin:3px 0;position:relative;
    animation:pop .28s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:bottom left}
  .msg.out{align-self:flex-end;background:var(--out);transform-origin:bottom right;border-bottom-right-radius:5px}
  .msg.in{align-self:flex-start;background:var(--in);border-bottom-left-radius:5px}
  .meta{float:right;font-size:11px;color:rgba(255,255,255,.55);margin:8px 0 -4px 10px;white-space:nowrap}
  .meta .ck{color:#8fc0ff;margin-left:2px;letter-spacing:-4px}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}
  .card{padding:0;overflow:hidden;max-width:82%}
  .card .body{padding:8px 12px 6px}
  .btn{border-top:.5px solid var(--sep);height:44px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--blue);font-size:15.5px;transition:color .2s}
  .btn.used{color:#8a8a8f}
  .btn svg{width:19px;height:19px}
  .quote{background:var(--out-quote);border-left:4px solid #fff;border-radius:8px;padding:6px 9px;margin:1px -5px 6px;font-size:13px;line-height:1.35}
  .quote b{display:block;font-size:13.5px;margin-bottom:1px}
  .typing{display:flex;gap:5px;padding:13px 14px}
  .typing i{width:8px;height:8px;border-radius:50%;background:#8e8e93;animation:blink 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  /* composer */
  .cp{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 10px}
  .cp .plus{font-size:30px;font-weight:300;width:26px;text-align:center;color:#fff}
  .inp{flex:1;height:36px;border-radius:18px;background:#262628;display:flex;align-items:center;padding:0 12px;font-size:16.5px;justify-content:space-between}
  .inp .caret{display:inline-block;width:2px;height:20px;background:var(--blue);margin-left:1px;vertical-align:middle;animation:car 1s steps(1) infinite}
  @keyframes car{50%{opacity:0}}
  .ic{width:26px;height:26px;color:#fff}
  .mic{width:34px;height:34px;border-radius:50%;background:#2f80ff;display:flex;align-items:center;justify-content:center}
  .mic svg{width:18px;height:18px}
  /* keyboard */
  #kb{flex:none;background:var(--kb);height:300px;overflow:hidden;transition:height .32s cubic-bezier(.3,.7,.2,1);border-radius:14px 14px 0 0}
  #kb.hide{height:0}
  .sug{height:40px;display:flex;align-items:center;justify-content:space-around;color:#e8e8ea;font-size:16px}
  .sug span{flex:1;text-align:center;border-right:1px solid #444}.sug span:last-child{border:none}
  .row{display:flex;justify-content:center;gap:6px;margin:0 3px 11px}
  .k{height:44px;flex:0 0 33px;border-radius:6px;background:var(--key);display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff;box-shadow:0 1px 0 #111;transition:background .08s}
  .k.s{background:var(--key2);flex:0 0 44px;font-size:17px}
  .k.wide{flex:1}
  .k.down{background:#8a8a8f}
  .homeind{flex:none;height:34px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
  .homeind i{width:134px;height:5px;border-radius:3px;background:#fff}
  #kb .homeind{height:44px;justify-content:space-between;padding:0 26px 10px;align-items:center;color:#ddd;font-size:22px}
  /* tap indicator */
  #tap{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.28);
    border:2px solid rgba(255,255,255,.8);pointer-events:none;z-index:99;opacity:0;transform:scale(.6);transition:opacity .12s,transform .12s}
  #tap.on{opacity:1;transform:scale(1)} #tap.press{transform:scale(.82);background:rgba(255,255,255,.42)}
  #homebar{display:none}
</style>
</head>
<body>
<div id="app">
  <div class="sb"><span>9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0z M3.4 6.8a6.6 6.6 0 0 1 9.2 0l-1.4 1.5a4.6 4.6 0 0 0-6.4 0z M1 4.4a10 10 0 0 1 14 0l-1.4 1.5a8 8 0 0 0-11.2 0z" fill="#fff"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/><rect x="24.5" y="4.5" width="1.6" height="4" rx=".8" fill="#fff" opacity=".5"/></svg>
    </span></div>
  <div class="hd">
    <div class="pill"><svg width="11" height="18" viewBox="0 0 11 18"><path d="M9 1 2 9l7 8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>13</div>
    <div class="av" style="transform:none;font-weight:600;font-size:22px">B</div>
    <div class="name">Panadería Banetto</div>
    <div class="pill" style="font-size:20px;letter-spacing:1px">•••</div>
  </div>
  <div id="chat">
    <div class="day">Hoy</div>
    <div class="note">Esta empresa usa un servicio seguro de Meta para administrar este chat. Toca para obtener más información.</div>
  </div>
  <div class="cp">
    <div class="plus">+</div>
    <div class="inp"><span id="txt"></span><svg class="ic" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M6 3h9l6 6v9a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z" fill="none" stroke="#fff" stroke-width="1.7"/><path d="M15 3v3a3 3 0 0 0 3 3h3" fill="none" stroke="#fff" stroke-width="1.7"/></svg></div>
    <svg class="ic" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.6" fill="none" stroke="#fff" stroke-width="1.7"/></svg>
    <div class="mic" id="send"><svg id="micicon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="#fff"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
  </div>
  <div id="kb">
    <div class="sug"><span>No</span><span>Y</span><span>Sí</span></div>
    <div class="row" id="r1"></div>
    <div class="row" id="r2"></div>
    <div class="row" id="r3"></div>
    <div class="row"><div class="k s">123</div><div class="k s emoji" style="font-size:20px">🙂</div><div class="k wide" id="space"></div><div class="k s" style="flex:0 0 88px">↩</div></div>
  </div>
  <div class="homeind" id="homebar"><i></i></div>
  <div id="tap"></div>
</div>
<script>
  const ROWS=['QWERTYUIOP','ASDFGHJKLÑ','ZXCVBNM'];
  ROWS.forEach((r,i)=>{const el=document.getElementById('r'+(i+1));
    if(i===2){el.innerHTML='<div class="k s">⇧</div>'}
    for(const c of r) el.insertAdjacentHTML('beforeend',`<div class="k" data-k="${c}">${c}</div>`);
    if(i===2) el.insertAdjacentHTML('beforeend','<div class="k s">⌫</div>');
    if(i===2){el.style.gap='6px'}
  });
  const $=s=>document.querySelector(s), chat=$('#chat'), txt=$('#txt');
  const REPLY='<svg viewBox="0 0 24 24"><path d="M10 5 4 11l6 6M4 11h10a6 6 0 0 1 6 6v1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const LINK='<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const time=t=>`<span class="meta">${t}</span>`, timeOut=t=>`<span class="meta">${t} <span class="ck">✓✓</span></span>`;
  function caret(){ txt.innerHTML = txt.dataset.v ? txt.dataset.v.replace(/&/g,'&amp;')+'<span class="caret"></span>' : '<span class="caret"></span>'; }
  window.ui = {
    setText(v){ txt.dataset.v=v; caret();
      $('#send').innerHTML = v ? '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'
                              : '<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="#fff"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'; },
    keyDown(c,on){ const k=document.querySelector(`[data-k="${c}"]`); if(k) k.classList.toggle('down',on); },
    add(html){ chat.insertAdjacentHTML('beforeend', html); const el=chat.lastElementChild; this.bottom(); return el; },
    bottom(inst){ chat.scrollTo({top:chat.scrollHeight, behavior: inst?'auto':'smooth'}); },
    out(text,t){ return this.add(`<div class="msg out">${text}${timeOut(t)}</div>`); },
    typing(on){ const e=$('#typing'); if(on && !e) this.add('<div class="msg in typing" id="typing"><i></i><i></i><i></i></div>'); if(!on && e) e.remove(); },
    card(text,t,buttons,icon){ this.typing(false);
      return this.add(`<div class="msg in card"><div class="body">${text}${time(t)}</div>${buttons.map((b,i)=>`<div class="btn" data-b="${i}">${icon==='link'?LINK:REPLY}<span>${b}</span></div>`).join('')}</div>`); },
    hideKb(){ $('#kb').classList.add('hide'); $('#homebar').style.display='flex'; txt.innerHTML=''; const t0=performance.now(); const f=()=>{ chat.scrollTop=chat.scrollHeight; if(performance.now()-t0<400) requestAnimationFrame(f); }; f(); },
    noKb(){ $('#kb').style.transition='none'; this.hideKb(); },
    dot(x,y,c){ const d=$('#tap'); d.style.left=x+'px'; d.style.top=y+'px'; d.className=c; },
  };
  caret();
  // restore state for the closing scene
  if(location.hash.startsWith('#outro')){
    ui.noKb();
    ui.out('Hola','9:41 a.m.');
    ui.card('¡Hola! Bienvenido a <b>Panadería Banetto</b> 🥐 ¿En qué podemos ayudarte?','9:41 a.m.',['<span class="emoji">🛒</span> Hacer pedido','<span class="emoji">📍</span> Facturación','<span class="emoji">💬</span> Ayuda']).querySelector('[data-b="0"]').classList.add('used');
    ui.out('<div class="quote"><b>Panadería Banetto</b>¡Hola! Bienvenido a Panadería Banetto 🥐 ¿En qué podemos ayudarte?</div><span class="emoji">🛒</span> Hacer pedido','9:41 a.m.');
    ui.card('¡Perfecto! <span class="emoji">🥖</span> Entra a tu cuenta de mayoreo y arma el pedido de la semana. Recuerda pedir con al menos <b>36 h de anticipación</b>.','9:41 a.m.',['Hacer mi pedido'],'link');
    document.querySelectorAll('.msg').forEach(m=>m.style.animation='none'); ui.bottom(true);
  }
</script>
</body>
</html>
